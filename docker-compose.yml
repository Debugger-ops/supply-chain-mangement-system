version: "3.8"

# Full local stack: Redis (inventory reservations), Kafka in KRaft mode (no
# Zookeeper needed), Postgres (order persistence), and the app itself.
# `docker compose up` gives you the "production-shaped" version of this repo;
# `npm run dev` alone (against a bare local redis-server) is enough for the
# in-memory-event-bus development mode used by the test suite.

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    ports: ["3000:3000"]
    depends_on: [redis, kafka, postgres]
    environment:
      REDIS_DRIVER: ioredis
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://app:app@postgres:5432/supply_chain
      PORT: "3000"
