apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minimal-footprint profile for a local kind/minikube cluster: 1 app replica,
# smaller resource requests, HPA effectively disabled (min=max=1). Deploys
# to the same "supply-chain-saga" namespace as the base and the prod overlay
# — run dev and prod on separate clusters (or rename the namespace yourself)
# rather than both at once, since they'd otherwise collide.

resources:
  - ../../base

images:
  - name: supply-chain-saga
    newTag: dev

patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "250m", memory: "128Mi" }
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never # expects `kind load docker-image supply-chain-saga:dev`

  - target:
      kind: HorizontalPodAutoscaler
      name: app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1

  - target:
      kind: PodDisruptionBudget
      name: app
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
