# Default-deny-ish network segmentation: Redis/Postgres/Kafka only accept
# traffic from the app component (or, for Kafka, from other Kafka pods for
# controller traffic) — not from every pod in the namespace or cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-app-only
  namespace: supply-chain-saga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-app-only
  namespace: supply-chain-saga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-allow-app-and-self
  namespace: supply-chain-saga
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kafka
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: kafka
      ports:
        - port: 9092
        - port: 9093
