apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: supply-chain-saga
  labels:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: api
spec:
  replicas: 2 # >1 by default specifically to prove the whole point of this
              # project: reservation correctness holds across multiple
              # concurrently-running instances, not just within one process.
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-chain-saga
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supply-chain-saga
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: app
          image: supply-chain-saga:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Liveness: process-only check, no dependency calls — a flaky
          # Redis should trigger readiness failures, not a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: actually checks Redis reachability — see src/api/server.ts.
          # A pod that fails this is pulled out of the Service's load-balancing
          # rotation without being restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Gives the process time to finish in-flight sagas (e.g. mid-compensation)
          # before SIGKILL when a pod is being replaced during a rollout/scale-down.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: supply-chain-saga
  labels:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
