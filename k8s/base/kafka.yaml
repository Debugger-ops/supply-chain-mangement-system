# Single-broker Kafka in KRaft mode (no Zookeeper) for local/demo clusters —
# mirrors docker-compose.yml's kafka service. A real deployment would run
# the Strimzi Kafka Operator with a 3+ broker cluster instead of a bare
# StatefulSet like this one; this is intentionally the "just enough to prove
# the saga/event-bus code path works against a real broker" version.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: supply-chain-saga
  labels:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-chain-saga
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supply-chain-saga
        app.kubernetes.io/component: kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: supply-chain-saga
  labels:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: kafka
spec:
  clusterIP: None # headless — gives kafka-0.kafka stable DNS, referenced in KAFKA_CFG_ADVERTISED_LISTENERS above
  selector:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: controller
      port: 9093
      targetPort: controller
