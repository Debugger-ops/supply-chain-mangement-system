# Placeholder Secret checked into the repo for local kind/minikube demos only.
# Never commit real credentials — in a real cluster this would come from
# `kubectl create secret generic app-secret --from-literal=DATABASE_URL=... `
# or, better, an external secrets manager (Sealed Secrets / External Secrets
# Operator / cloud provider's secret store) rather than a plain Secret
# manifest at all.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: supply-chain-saga
  labels:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: "postgres://app:app@postgres:5432/supply_chain"
  POSTGRES_PASSWORD: "app"
