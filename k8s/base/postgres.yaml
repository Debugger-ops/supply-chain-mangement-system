# StatefulSet (not a Deployment) because Postgres needs a stable identity and
# its own persistent volume that survives a pod reschedule — the thing a
# Deployment's interchangeable-pod model doesn't give you.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: supply-chain-saga
  labels:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-chain-saga
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supply-chain-saga
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: supply_chain
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "supply_chain"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "supply_chain"]
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-schema
          configMap:
            name: postgres-init-schema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: supply-chain-saga
  labels:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None # headless — StatefulSet pods get stable DNS (postgres-0.postgres.*)
  selector:
    app.kubernetes.io/name: supply-chain-saga
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
